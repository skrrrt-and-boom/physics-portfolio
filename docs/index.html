<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rectangular barrier transmission explorer</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e5e7eb;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { line-height: 1.55; color: #cbd5e1; }
    .panel {
      margin: 22px 0;
      padding: 18px;
      border: 1px solid #263145;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.86);
    }
    label {
      display: grid;
      gap: 8px;
      margin: 14px 0;
      font-weight: 650;
    }
    input[type="range"] { width: 100%; }
    span { color: #93c5fd; font-variant-numeric: tabular-nums; }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      background: #020617;
      border: 1px solid #1e293b;
    }
    .note { color: #94a3b8; font-size: 14px; }
    code { color: #bfdbfe; }
  </style>
</head>
<body>
  <main>
    <h1>Rectangular barrier transmission explorer</h1>
    <p>Dimensionless units: ħ = m = 1. The curve is the analytic transmission probability T(E) for a rectangular barrier of height V0 and width a.</p>

    <section class="panel" aria-label="controls">
      <label>Barrier height V0 <input id="V0" type="range" min="0.5" max="12" step="0.1" value="4"> <span id="V0Out"></span></label>
      <label>Barrier width a <input id="a" type="range" min="0.1" max="5" step="0.05" value="2"> <span id="aOut"></span></label>
      <label>Energy max <input id="emax" type="range" min="4" max="20" step="0.5" value="12"> <span id="emaxOut"></span></label>
    </section>

    <canvas id="plot" width="980" height="560" aria-label="Transmission probability versus energy"></canvas>
    <p class="note">The vertical marker is E = V0. At that point the limit T = 1 / (1 + V0 a² / 2) is used.</p>
  </main>
  <script src="tunneling.js"></script>
</body>
</html>
